name: Obsidian Headless Hardened
version: "0.1.0-dev"
slug: obsidian_headless_hardened
description: >-
  Isolated pull-only Obsidian Sync with optional Git and reMarkable acquisition.
  Read-only authenticated MCP over operator-configured TLS. Local build preview.
url: https://github.com/kamikazaaa/hassio-obsidian-headless
icon: true
logo: true
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: false
host_network: false
ports:
  8420/tcp: null
ports_description:
  8420/tcp: Read-only MCP over TLS; enable explicitly after configuring authentication and certificate
options:
  obsidian_auth_token: ""
  vault_name: ""
  vault_password: ""
  obsidian_sync_interval: 300
  enable_git_sync: false
  git_repos: ""
  git_auth_token: ""
  git_sync_interval: 900
  enable_remarkable: false
  remarkable_pairing_code: ""
  remarkable_sync_interval: 300
  remarkable_tag_prefix: ""
  remarkable_extra_tags: ""
  ha_ocr_url: ""
  ha_ocr_token: ""
  ha_ocr_entity: ""
  enable_mcp: false
  mcp_auth_token: ""
  mcp_tls_cert: ""
  mcp_tls_key: ""
  mcp_allowed_hosts: ""
  mcp_allowed_origins: ""
schema:
  obsidian_auth_token: password
  vault_name: str
  vault_password: password?
  obsidian_sync_interval: int(30,86400)
  enable_git_sync: bool
  git_repos: str?
  git_auth_token: password?
  git_sync_interval: int(30,86400)
  enable_remarkable: bool
  remarkable_pairing_code: password?
  remarkable_sync_interval: int(30,86400)
  remarkable_tag_prefix: str?
  remarkable_extra_tags: str?
  ha_ocr_url: str?
  ha_ocr_token: password?
  ha_ocr_entity: str?
  enable_mcp: bool
  mcp_auth_token: password?
  mcp_tls_cert: str?
  mcp_tls_key: password?
  mcp_allowed_hosts: str?
  mcp_allowed_origins: str?
