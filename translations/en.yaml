configuration:
  obsidian_auth_token:
    name: Obsidian Sync authentication token
    description: Official Obsidian Headless token obtained outside this addon; stored only in managed options and the Obsidian service environment.
  vault_name:
    name: Remote vault ID or exact name
    description: Use the stable remote ID when possible. Changing the source on an existing workspace is refused; use a fresh addon instance.
  vault_password:
    name: Vault encryption password
    description: Required for end-to-end encrypted vaults. Sent through private standard input to official setup. The official prompt does not support trailing whitespace; such passwords are refused.
  obsidian_sync_interval:
    name: Obsidian acquisition interval
    description: Seconds between one-shot pull-only synchronization and immutable publication; minimum 30.
  enable_git_sync:
    name: Enable independent Git acquisition
    description: Fetch into an isolated Git workspace and publish immutable commit trees for read-only access.
  git_repos:
    name: Git repositories
    description: "One independent source per line: <namespace>|<HTTPS remote URL>[|<branch>]. Existing vault folders are never adopted."
  git_auth_token:
    name: Git read-only access token
    description: Optional repository-scoped read-only token. Never placed in remote URLs or shared with other services.
  git_sync_interval:
    name: Git acquisition interval
    description: Seconds between acquisitions; minimum 30.
  enable_remarkable:
    name: Enable isolated reMarkable acquisition
    description: Download and convert in a private workspace, then publish generated documents after successful conversion.
  remarkable_pairing_code:
    name: reMarkable one-time pairing code
    description: Enter the official one-time code for initial pairing. Sent only to rmapi standard input. Clear after successful pairing; existing credentials are never automatically replaced.
  remarkable_sync_interval:
    name: reMarkable acquisition interval
    description: Seconds between acquisitions; minimum 30.
  remarkable_tag_prefix:
    name: reMarkable tag prefix
    description: Prefix for device labels mapped to generated document tags.
  remarkable_extra_tags:
    name: Additional reMarkable tags
    description: Comma-separated tags added to generated documents.
  ha_ocr_url:
    name: Optional OCR HTTPS endpoint
    description: HTTPS endpoint accepting rendered page images. OCR failures prevent publication when images require transcription. Native pen strokes are not rendered by this addon.
  ha_ocr_token:
    name: OCR endpoint access token
    description: Optional credential delivered only to the reMarkable service.
  ha_ocr_entity:
    name: OCR entity identifier
    description: Optional image processing entity identifier included in OCR requests.
  enable_mcp:
    name: Enable read-only MCP
    description: Requires bearer authentication, a valid matching TLS certificate/key pair, and an exact allowed-host policy. Publish port 8420 explicitly in Network after configuration.
  mcp_auth_token:
    name: MCP bearer token
    description: At least 32 random bearer-safe characters; use a 64-character random hexadecimal secret. Generate outside the addon and configure clients with the same secret.
  mcp_tls_cert:
    name: MCP TLS certificate PEM
    description: Operator-supplied PEM certificate chain for the client-facing hostname. Enter multiline PEM in the managed YAML options editor.
  mcp_tls_key:
    name: MCP TLS private key PEM
    description: Matching unencrypted private key in PEM format. Enter multiline PEM in managed options; validated and stored with private MCP service permissions.
  mcp_allowed_hosts:
    name: Allowed MCP hosts
    description: "Comma-separated exact Host header values including the published port when used, for example notes.example.com:8420. No wildcards."
  mcp_allowed_origins:
    name: Allowed MCP browser origins
    description: Comma-separated exact HTTPS origins for authorized browser clients. Leave empty for clients that send no Origin header.
network:
  8420/tcp: Authenticated read-only MCP over TLS; unbound by default
