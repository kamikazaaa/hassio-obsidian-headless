name: Verify hardened development build

on:
  push:
  pull_request:
  workflow_dispatch:

# No publishing, repository writes, OIDC tokens, or external-repo PATs.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python and Go (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.15"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.9"
          cache: false
      - name: Install locked Python runtime and test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: --index-url=https://pypi.org/simple -r requirements.lock -r .github/requirements-test.lock
          .venv/bin/python -m pip check
      - name: Python behavioral tests including actual service UIDs
        # Only synthetic fixtures on the ephemeral runner; no cloud accounts.
        run: sudo -- .venv/bin/python -m pytest -q tests
      - name: Go format, vet, race tests and build
        working-directory: remarkable-sync
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          test -z "$(gofmt -l .)"
          go mod verify
          go vet ./...
          go test -race ./...
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -o /tmp/remarkable-sync .
      - name: Check service shell syntax
        run: |
          for script in rootfs/etc/s6-overlay/s6-rc.d/*/run rootfs/etc/s6-overlay/s6-rc.d/*/finish; do
            sh -n "$script"
          done

  image:
    name: Image build and smoke test (${{ matrix.arch }})
    needs: tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build locally without publishing
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          docker build --pull --platform "$BUILD_PLATFORM" --build-arg BUILD_ARCH="$BUILD_ARCH" --tag obsidian-hardened:test .
      - name: Smoke test installed runtime without network or credentials
        run: |
          docker run --rm --network none --workdir /tmp --user 10004:10004 --entrypoint /usr/local/bin/python3 obsidian-hardened:test -c 'import ssl, sqlite3, ctypes, bz2, lzma; import hardened.runtime, hardened.reader, hardened.snapshots, hardened.git_sync'
          docker run --rm --network none --user 10001:10001 --entrypoint /usr/local/bin/ob obsidian-hardened:test --version
          docker run --rm --network none --user 10003:10003 --entrypoint /usr/local/bin/rmapi obsidian-hardened:test version
          docker run --rm --network none --user 10001:10001 --workdir /opt/obsidian --entrypoint /usr/local/bin/node obsidian-hardened:test -e 'const D = require("better-sqlite3"); const d = new D(":memory:"); if (d.prepare("SELECT 42 AS v").get().v !== 42) process.exit(1); d.close();'
